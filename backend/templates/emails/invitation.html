<!doctype html>
<html>
  <body style="margin:0;background:#f7f7f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1d1d1f;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:48px 16px;">
      <tr><td align="center">
        <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #e8e8e4;border-radius:20px;padding:40px;">
          <tr><td style="font-size:20px;font-weight:600;letter-spacing:-0.01em;">dhara</td></tr>
          <tr><td style="padding-top:28px;font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-0.02em;">
            You're invited to join {{ organization }}
          </td></tr>
          <tr><td style="padding-top:12px;font-size:15px;line-height:1.6;color:#6e6e73;">
            {{ inviter }} invited you to {{ organization }} on dhara as {{ role_article }} <strong style="color:#1d1d1f;">{{ role }}</strong>.
            Sign in with your Google account ({{ email }}) to accept.
          </td></tr>
          <tr><td style="padding-top:28px;">
            <a href="{{ url }}" style="display:inline-block;background:#1d1d1f;color:#ffffff;text-decoration:none;font-size:15px;font-weight:500;padding:12px 22px;border-radius:999px;">Accept invitation</a>
          </td></tr>
          <tr><td style="padding-top:28px;font-size:13px;color:#8e8e93;">This invitation expires in 7 days.</td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
